version: 2
updates:
  # マイナー・パッチ更新は1つの PR にまとめる。
  # メジャー更新は破壊的変更を含みうるため、グループに入れず依存ごとに個別の PR にする
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]
